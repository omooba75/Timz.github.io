<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Shoot | TIMZ VISUALS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Color Palette & Variables */
        :root {
            --bg-black: #0b0c10;
            --bg-card: #1f2833;
            --gold: #d4af37;
            --gold-hover: #f3ca40;
            --text-light: #f4f4f4;
            --text-gray: #c5c6c7;
            --font-main: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-black);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            height: 45px;
            width: auto;
            border-radius: 6px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-light);
            text-decoration: none;
        }

        .brand-name span {
            color: var(--gold);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--gold);
        }

        /* Booking Container */
        .booking-container {
            max-width: 650px;
            margin: 130px auto 60px auto;
            padding: 40px 30px;
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .booking-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .booking-header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .booking-header p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        /* Form Styling */
        .booking-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--bg-black);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-light);
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .form-group select option {
            background-color: var(--bg-black);
            color: var(--text-light);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--gold);
            color: var(--bg-black);
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--gold-hover);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            background-color: #050507;
            padding: 30px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.8rem;
            color: #555;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 15px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .booking-container {
                margin: 110px 15px 40px 15px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <nav class="navbar">
        <div class="logo-container">
            <img src="timz.jpeg" alt="TIMZ VISUALS Logo" class="brand-logo">
            <a href="index.html" class="brand-name">TIMZ <span>VISUALS</span></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="booking.html" class="active">Book Now</a></li>
            <li><a href="payment.html">Pay Deposit</a></li>
        </ul>
    </nav>

    <!-- Main Form Container -->
    <main class="booking-container">
        <div class="booking-header">
            <h1>Book Your Shoot</h1>
            <p>Fill out your details below. Once submitted, you'll be redirected to pay your deposit.</p>
        </div>

        <!-- Booking Form with Formspree Endpoint -->
        <form id="bookingForm" action="https://formspree.io/f/xnpqwqlb" method="POST" class="booking-form">
            
            <!-- Redirect Setting for Formspree -->
            <input type="hidden" name="_next" value="payment.html">

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="Full Name" placeholder="e.g. Marcus Vance" required>
            </div>

            <!-- Email & Phone Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="Email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="Phone Number" placeholder="613-xxx-xxxx" required>
                </div>
            </div>

            <!-- Package Selection & Preferred Date Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="package">Select Package *</label>
                    <select id="package" name="Package Option" required>
                        <option value="" disabled selected>Select an Option</option>
                        <option value="Mini Package ($50)">Mini Package ($50)</option>
                        <option value="Standard Package ($100)">Standard Package ($100)</option>
                        <option value="Sports & Events ($120)">Sports & Events ($120)</option>
                        <option value="Group Shoot ($20/person)">Group Shoot ($20/person)</option>
                        <option value="Other / Custom Project">Other / Custom Project</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Preferred Date *</label>
                    <input type="date" id="date" name="Preferred Date" required>
                </div>
            </div>

            <!-- Shoot Details -->
            <div class="form-group">
                <label for="details">Shoot Details / Concept</label>
                <textarea id="details" name="Shoot Details" rows="4" placeholder="Tell us about your location ideas, outfit count, music video concept, or vision..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn-submit">Submit & Proceed to Deposit ($20)</button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 TIMZ VISUALS. All rights reserved.</p>
    </footer>

    <!-- Form Submission Handling Script -->
    <script>
        const form = document.getElementById('bookingForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // Stop normal form submission
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending Booking Request...";

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Smoothly redirect to payment page on success
                    window.location.href = "payment.html";
                } else {
                    alert("There was an issue sending your request. Please try again or contact us directly.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Submit & Proceed to Deposit ($20)";
                }
            } catch (error) {
                alert("Network error. Please check your connection and try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit & Proceed to Deposit ($20)";
            }
        });
    </script>

</body>
</html>
