<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session | TIMZ VISUALS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Color Palette */
        :root {
            --bg-black: #0b0c10;
            --bg-card: #1f2833;
            --gold: #d4af37;
            --gold-hover: #f3ca40;
            --text-light: #f4f4f4;
            --text-gray: #c5c6c7;
            --font-main: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-black);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            height: 45px;
            width: auto;
            border-radius: 6px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-light);
            text-decoration: none;
        }

        .brand-name span {
            color: var(--gold);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-gray);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        /* Booking Container */
        .booking-container {
            max-width: 700px;
            margin: 130px auto 60px auto;
            padding: 40px 30px;
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .booking-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .booking-header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .booking-header p {
            color: var(--gold);
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: var(--text-gray);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--bg-black);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-light);
            font-family: var(--font-main);
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        /* Notice Box */
        .deposit-notice {
            background-color: rgba(212, 175, 55, 0.1);
            border-left: 4px solid var(--gold);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .deposit-notice strong {
            color: var(--gold);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background-color: var(--gold);
            color: var(--bg-black);
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            background-color: var(--gold-hover);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            background-color: #050507;
            padding: 30px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.8rem;
            color: #555;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .navbar {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <nav class="navbar">
        <div class="logo-container">
            <img src="timz.jpeg" alt="TIMZ VISUALS Logo" class="brand-logo">
            <a href="index.html" class="brand-name">TIMZ <span>VISUALS</span></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="index.html#portfolio">Work</a></li>
            <li><a href="index.html#services">Pricing</a></li>
        </ul>
    </nav>

    <!-- Booking Form Section -->
    <div class="booking-container">
        <div class="booking-header">
            <h1>Book Your Session</h1>
            <p>Let's create something visual together</p>
        </div>

        <!-- Submit directly redirects to payment.html -->
        <form action="payment.html" method="GET">
            
            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <!-- Email & Phone Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="(555) 000-0000" required>
                </div>
            </div>

            <!-- Package Selection -->
            <div class="form-group">
                <label for="package">Select Photo Package</label>
                <select id="package" name="package" required>
                    <option value="" disabled selected>Choose a package...</option>
                    <option value="mini">Mini Session - $50 (20-30 mins)</option>
                    <option value="standard">Standard Session - $100 (1 Hour - Most Popular)</option>
                    <option value="sports">Sports / Event Coverage - $120 (Full Game/Event)</option>
                    <option value="group">Group / Team Shoot - $20 per person</option>
                </select>
            </div>

            <!-- Preferred Date & Time -->
            <div class="form-row">
                <div class="form-group">
                    <label for="date">Preferred Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="time">Preferred Time</label>
                    <input type="time" id="time" name="time" required>
                </div>
            </div>

            <!-- Shoot Notes / Details -->
            <div class="form-group">
                <label for="notes">Shoot Location / Vision / Special Requests</label>
                <textarea id="notes" name="notes" rows="4" placeholder="Tell Timothy what type of photos you want, location ideas, or outfits..."></textarea>
            </div>

            <!-- Deposit Notice -->
            <div class="deposit-notice">
                📌 <strong>Next Step:</strong> Submitting this form will take you to the payment page to complete your <strong>$20 booking deposit</strong>.
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Proceed to $20 Deposit</button>
        </form>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 TIMZ VISUALS. All rights reserved.</p>
    </footer>

</body>
</html>
