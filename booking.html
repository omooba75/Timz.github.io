<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book a Shoot | TIMZ VISUALS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* Color Palette & Variables */
        :root {
            --bg-black: #0b0c10;
            --bg-card: #14181f;
            --bg-input: #0b0d12;
            --gold: #E3A62B;
            --gold-hover: #f0be53;
            --text-light: #f4f4f4;
            --text-gray: #a0a5b1;
            --font-main: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-black);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 40px;
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(227, 166, 43, 0.25);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1001;
        }

        .brand-logo {
            height: 40px;
            width: auto;
            border-radius: 6px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-light);
            text-decoration: none;
        }

        .brand-name span {
            color: var(--gold);
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            z-index: 1001;
            padding: 5px;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background-color: var(--gold);
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--gold);
        }

        /* Booking Container */
        .booking-container {
            width: 90%;
            max-width: 680px;
            margin: 120px auto 50px auto;
            padding: 45px 35px;
            background-color: var(--bg-card);
            border-radius: 16px;
            border: 1px solid rgba(227, 166, 43, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(227, 166, 43, 0.05);
        }

        .booking-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .booking-header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #ffffff;
            background: linear-gradient(135deg, #ffffff 0%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .booking-header p {
            color: var(--text-gray);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Form Styling */
        .booking-form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--gold);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px 18px;
            background-color: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: var(--text-light);
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        /* Specific Select Styling */
        .form-group select {
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23E3A62B' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
            padding-right: 45px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(227, 166, 43, 0.25);
            background-color: #0d1017;
        }

        .form-group select option {
            background-color: var(--bg-black);
            color: var(--text-light);
            padding: 10px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--gold) 0%, #b8821f 100%);
            color: var(--bg-black);
            padding: 18px;
            border: none;
            border-radius: 35px;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(227, 166, 43, 0.2);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--gold-hover) 0%, var(--gold) 100%);
            box-shadow: 0 6px 25px rgba(227, 166, 43, 0.4);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Custom Modal Popup (Replaces Browser Alert) */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--gold);
            border-radius: 14px;
            padding: 30px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(227, 166, 43, 0.2);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 {
            color: var(--text-light);
            font-size: 1.3rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .modal-content p {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .btn-modal-close {
            background-color: var(--gold);
            color: var(--bg-black);
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-modal-close:hover {
            background-color: var(--gold-hover);
        }

        /* Footer */
        .footer {
            background-color: #050507;
            padding: 25px 20px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.8rem;
            color: #666;
            margin-top: auto;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .menu-toggle {
                display: flex;
            }

            .menu-toggle.active span:nth-child(1) {
                transform: rotate(45deg) translate(5px, 6px);
            }

            .menu-toggle.active span:nth-child(2) {
                opacity: 0;
            }

            .menu-toggle.active span:nth-child(3) {
                transform: rotate(-45deg) translate(5px, -6px);
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 75%;
                max-width: 300px;
                height: 100vh;
                background-color: rgba(15, 18, 24, 0.98);
                backdrop-filter: blur(15px);
                flex-direction: column;
                justify-content: center;
                gap: 30px;
                transition: right 0.4s ease;
                box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
                border-left: 1px solid rgba(227, 166, 43, 0.2);
            }

            .nav-links.active {
                right: 0;
            }

            .booking-container {
                width: 92%;
                margin: 100px auto 40px auto;
                padding: 30px 20px;
                border-radius: 12px;
            }

            .booking-header h1 {
                font-size: 1.75rem;
            }

            .booking-header p {
                font-size: 0.88rem;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 22px;
            }

            /* Prevents iOS from zooming in on focus */
            .form-group input,
            .form-group select,
            .form-group textarea {
                font-size: 16px;
                padding: 14px;
            }

            .btn-submit {
                padding: 16px;
                font-size: 0.88rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <nav class="navbar">
        <div class="logo-container">
            <img src="timz.jpeg" alt="TIMZ VISUALS Logo" class="brand-logo">
            <a href="index.html" class="brand-name">TIMZ <span>VISUALS</span></a>
        </div>

        <div class="menu-toggle" id="mobileMenuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="booking.html" class="active">Book Now</a></li>
            <li><a href="payment.html">Pay Deposit</a></li>
        </ul>
    </nav>

    <!-- Main Form Container -->
    <main class="booking-container">
        <div class="booking-header">
            <h1>Book Your Shoot</h1>
            <p>Fill out your details below. Once submitted, you'll be redirected to pay your deposit.</p>
        </div>

        <!-- Booking Form with Formspree Endpoint -->
        <form id="bookingForm" action="https://formspree.io/f/xnpqwqlb" method="POST" class="booking-form">

            <input type="hidden" name="_next" value="payment.html">

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="Full Name" placeholder="e.g. Marcus Vance" required>
            </div>

            <!-- Email & Phone Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="Email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="Phone Number" placeholder="613-xxx-xxxx" required>
                </div>
            </div>

            <!-- Package Selection & Preferred Date Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="package">Select Package *</label>
                    <select id="package" name="Package Option" required>
                        <option value="" disabled selected>Select an Option</option>
                        <option value="Mini Package ($50)">Mini Package ($50)</option>
                        <option value="Standard Package ($100)">Standard Package ($100)</option>
                        <option value="Sports & Events ($120)">Sports & Events ($120)</option>
                        <option value="Group Shoot ($20/person)">Group Shoot ($20/person)</option>
                        <option value="Other / Custom Project">Other / Custom Project</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Preferred Date *</label>
                    <input type="date" id="date" name="Preferred Date" required>
                </div>
            </div>

            <!-- Shoot Details -->
            <div class="form-group">
                <label for="details">Shoot Details / Concept</label>
                <textarea id="details" name="Shoot Details" rows="4" placeholder="Tell us about your location ideas, outfit count, music video concept, or vision..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn-submit">Submit & Proceed to Deposit ($20)</button>
        </form>
    </main>

    <!-- Custom Modal Overlay (Replaces Default Browser Alerts) -->
    <div class="custom-modal" id="errorModal">
        <div class="modal-content">
            <h3 id="modalTitle">Notice</h3>
            <p id="modalMessage">There was an issue processing your request.</p>
            <button class="btn-modal-close" onclick="closeModal()">Close</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 TIMZ VISUALS. All rights reserved.</p>
    </footer>

    <!-- Form Submission & Mobile Nav Script -->
    <script>
        // Mobile Navigation Toggle Logic
        const menuToggle = document.getElementById('mobileMenuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        // Close Mobile Menu when clicking outside or link
        document.addEventListener('click', (e) => {
            if (!menuToggle.contains(e.target) && !navLinks.contains(e.target) && navLinks.classList.contains('active')) {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('active');
            }
        });

        // Form Handling Logic
        const form = document.getElementById('bookingForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorModal = document.getElementById('errorModal');
        const modalMessage = document.getElementById('modalMessage');

        function showErrorModal(message) {
            modalMessage.innerText = message;
            errorModal.style.display = 'flex';
        }

        function closeModal() {
            errorModal.style.display = 'none';
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // Stop normal browser submission

            submitBtn.disabled = true;
            submitBtn.innerText = "Sending Booking Request...";

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Redirect directly to payment page
                    window.location.href = "payment.html";
                } else {
                    showErrorModal("There was an issue sending your request. Please try again.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Submit & Proceed to Deposit ($20)";
                }
            } catch (error) {
                showErrorModal("Network error. Please check your connection and try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit & Proceed to Deposit ($20)";
            }
        });
    </script>

</body>
</html>
